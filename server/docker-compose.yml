services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      RATSENSE_MQTT_ENABLED: "1"
      RATSENSE_MQTT_HOST: mosquitto
      RATSENSE_API_TOKEN: ${RATSENSE_API_TOKEN:-}
      RATSENSE_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data

